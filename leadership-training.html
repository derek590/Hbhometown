function NotesPanel({ isOpen, onClose, context, notes, onAddNote }) {
  const [draft, setDraft] = useState("");
  if (!isOpen) return null;
  const save = () => {
    if (!draft.trim()) return;
    onAddNote({ text: draft.trim(), context, time: new Date().toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) });
    setDraft("");
  };
  return (
    <div className="notes-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="notes-panel">
        <div className="notes-header">
          <span className="notes-header-text">Field Notes</span>
          <button className="notes-close" onClick={onClose}>×</button>
        </div>
        <div className="notes-context">{context || "General Notes"}</div>
        <textarea className="notes-input" placeholder="Record your thoughts, commitments, reflections..." value={draft} onChange={(e) => setDraft(e.target.value)} />
        {notes.length > 0 && (
          <div className="notes-entries">
            {[...notes].reverse().map((n, i) => (
              <div key={i} className="notes-entry">
                <div className="notes-entry-meta">{n.time} · {n.context}</div>
                <div className="notes-entry-text">{n.text}</div>
              </div>
            ))}
          </div>
        )}
        <div className="notes-footer">
          <button className="btn-primary" onClick={save}>Save Note</button>
          <button className="btn-secondary" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

function CheckItem({ text, checked, onToggle }) {

  );

              <div className="reading-number">{String(i+1).padStart(2,"0")}</div>
              <div className="reading-content">
                <div className="reading-author">{r.author}</div>
                <div className="reading-title">{r.title}</div>
                <div className="reading-desc">{r.desc}</div>
              </div>
            </div>
          ))}
          <button className="inline-note-btn" onClick={() => onNote("Reading Materials")}>Add Notes on Current Reading</button>
        </div>
      )}
      {sub === "cap" && (
        <div className="card">
          <div className="card-subtitle">Personal Growth Planning</div>
          <div className="card-title">My Corrective Action Plan</div>
          <div className="card-body" style={{ marginBottom: 20 }}>A corrective action plan for yourself is not punitive — it's a structured commitment to close the gap between where you are and where you want to be.</div>
          <div style={{ marginBottom: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#B8963E" }}>Development Window</div>
          <div className="plan-timeline" style={{ marginBottom: 24 }}>
            {[30, 60, 90].map(p => (
              <div key={p} className={`plan-phase ${capWindow === p ? "active" : ""}`} onClick={() => setCapWindow(p)}>
                <div className="plan-phase-label">Day</div>
                <div className="plan-phase-title">{p}</div>
              </div>
            ))}
          </div>
          {[
            { label: "Growth Area Identified", ph: "What specific behavior, habit, or competency are you working on?" },
            { label: `What Does Success Look Like at Day ${capWindow}?`, ph: "Describe specifically what will be different. Be concrete." },
            { label: "Actions You Will Take", ph: "What will you do, read, practice, or change? List each action." },
            { label: "Accountability Structure", ph: "Who will you share this with? How will you track it?" },
            { label: "What Will Get in the Way?", ph: "Name the obstacles you're anticipating — then name how you'll respond." },
          ].map((field, i) => (
            <div key={i} style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "#B8963E", marginBottom: 6 }}>{field.label}</div>
              <textarea className="reflect-area" placeholder={field.ph} />
            </div>
          ))}
          <button className="inline-note-btn" onClick={() => onNote(`CAP: Day ${capWindow} Window`)}>Save Plan to Field Notes</button>
        </div>
      )}
      {sub === "review" && (
        <div className="card">
          <div className="card-subtitle">Growth Review</div>
          <div className="card-title">30 · 60 · 90 Day Review</div>
          <div className="card-body" style={{ marginBottom: 20 }}>Review is not judgment — it's recalibration. Revisit what you committed to and assess with honesty what has moved, what hasn't, and what comes next.</div>
          <div className="plan-timeline" style={{ marginBottom: 24 }}>
            {[30, 60, 90].map(p => (
              <div key={p} className={`plan-phase ${reviewPhase === p ? "active" : ""}`} onClick={() => setReviewPhase(p)}>
                <div className="plan-phase-label">Day</div>
                <div className="plan-phase-title">{p} Review</div>
              </div>
            ))}
          </div>
          {[
            { label: "What Did You Commit to at Day 1?", ph: "Summarize the growth areas and actions you set out to work on." },
            { label: "What Has Actually Changed?", ph: "Be specific. What behaviors, habits, or outcomes look different?" },
            { label: `What Did Not Move by Day ${reviewPhase}?`, ph: "Where did the gap persist? What got in the way?" },
            { label: "What Did You Learn About Yourself?", ph: "Growth is often in what we discover, not just what we accomplish." },
            { label: "What Comes Next?", ph: "What are you recommitting to? What are you adding? What are you releasing?" },
          ].map((field, i) => (
            <div key={i} style={{ marginBottom: 16 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "#B8963E", marginBottom: 6 }}>{field.label}</div>
              <textarea className="reflect-area" placeholder={field.ph} />
            </div>
          ))}
          <button className="inline-note-btn" onClick={() => onNote(`Day ${reviewPhase} Self Review`)}>Save Review to Field Notes</button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [activeSection, setActiveSection] = useState("counseling");
  const [notesOpen, setNotesOpen] = useState(false);
  const [noteContext, setNoteContext] = useState("General Notes");
  const [allNotes, setAllNotes] = useState([]);
  const openNote = (ctx) => { setNoteContext(ctx); setNotesOpen(true); };
  const addNote = (note) => setAllNotes(n => [...n, note]);
  const navItems = [
    { id: "counseling", roman: "I", label: "Counseling Tools" },
    { id: "plans", roman: "II", label: "30 · 60 · 90 Plans" },
    { id: "growth", roman: "III", label: "Self Growth" },
  ];
  return (
    <>
      <style>{css}</style>
      <div className="app-shell">
        <header className="app-header">
          <div className="header-brand">
            <div className="header-eyebrow">H&amp;B Hometown LLC</div>
            <div className="header-title">Leadership Training</div>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <a href="index.html" className="header-back">← Back to Site</a>
            <button className="notes-trigger" onClick={() => { setNoteContext("General Notes"); setNotesOpen(true); }}>
              Field Notes
              {allNotes.length > 0 && <span className="notes-badge">{allNotes.length}</span>}
            </button>
          </div>
        </header>
        <nav className="primary-nav">
          {navItems.map(n => (
            <button key={n.id} className={`nav-tab ${activeSection === n.id ? "active" : ""}`} onClick={() => setActiveSection(n.id)}>
              <span className="tab-roman">{n.roman}</span>{n.label}
            </button>
          ))}
        </nav>
        <main className="main-content">
          {activeSection === "counseling" && <CounselingSection onNote={openNote} />}
          {activeSection === "plans" && <PlansSection onNote={openNote} />}
          {activeSection === "growth" && <SelfGrowthSection onNote={openNote} />}
        </main>
      </div>
      <NotesPanel isOpen={notesOpen} onClose={() => setNotesOpen(false)} context={noteContext} notes={allNotes} onAddNote={addNote} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
